<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Pickup & Drop-off Log</title>
  <style>
    :root {
      --primary: #0056b3;
      --success: #28a745;
      --danger: #dc3545;
      --dark: #212529;
      --gray: #6c757d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 16px;
      color: var(--dark);
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: var(--primary);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .required { color: var(--danger); }
    input[type="text"], select, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .btn-toggle {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #ccc;
      border-radius: 6px;
      background-color: #e9ecef;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-toggle.active-pickup { background-color: var(--primary); color: white; border-color: #004085; }
    .btn-toggle.active-dropoff { background-color: var(--success); color: white; border-color: #1e7e34; }
    .btn-toggle.active-asset { background-color: #17a2b8; color: white; border-color: #117a8b; }
    
    .conditional-group {
      display: none;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:disabled {
      background-color: var(--gray);
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Pickup / Drop-off Log</h2>
  <form id="logForm">

    <!-- Action Buttons -->
    <div class="form-group">
      <label>Action <span class="required">*</span></label>
      <div class="button-group">
        <button type="button" class="btn-toggle" id="btnPickup" onclick="selectAction('Pickup')">📦 Pickup</button>
        <button type="button" class="btn-toggle" id="btnDropoff" onclick="selectAction('Drop-off')">📥 Drop-off</button>
      </div>
      <input type="hidden" id="actionType" required>
    </div>

    <!-- Employee/Driver Name -->
    <div class="form-group">
      <label for="employeeName">Employee / Driver Name <span class="required">*</span></label>
      <input type="text" id="employeeName" placeholder="First and Last Name" required>
    </div>

    <!-- Project Number/Site Name -->
    <div class="form-group">
      <label for="projectSite">Project # / Site Name <span class="required">*</span></label>
      <input type="text" id="projectSite" placeholder="Enter project # or site name" required>
    </div>

    <!-- Location Zone Dropdown -->
    <div class="form-group">
      <label for="locationZone">Location Zone <span class="required">*</span></label>
      <select id="locationZone" required>
        <option value="" disabled selected>Select location zone...</option>
        <option value="scaffold yard">scaffold yard</option>
        <option value="office yard">office yard</option>
        <option value="office">office</option>
        <option value="bay one">bay one</option>
        <option value="bay two">bay two</option>
        <option value="tool crib">tool crib</option>
        <option value="other">other</option>
      </select>
    </div>

    <!-- Asset Type Selection Buttons -->
    <div class="form-group">
      <label>Asset Type <span class="required">*</span></label>
      <div class="button-group">
        <button type="button" class="btn-toggle" id="btnVehicle" onclick="selectAssetType('Vehicle')">🚗 Vehicle</button>
        <button type="button" class="btn-toggle" id="btnTrailer" onclick="selectAssetType('Trailer')">🚛 Trailer</button>
      </div>
      <input type="hidden" id="assetType" required>
    </div>

    <!-- Conditional Input: Unit # or License Plate # -->
    <div class="form-group conditional-group" id="assetDetailContainer">
      <label id="assetDetailLabel" for="assetDetailInput">Unit # <span class="required">*</span></label>
      <input type="text" id="assetDetailInput" placeholder="Enter ID">
    </div>

    <!-- Mandatory Photo Attachment -->
    <div class="form-group">
      <label for="photoFile">Photo Attachment (Mandatory) <span class="required">*</span></label>
      <input type="file" id="photoFile" accept="image/*" capture="environment" required>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Log Entry</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script src="app.js"></script>
</body>
</html>
